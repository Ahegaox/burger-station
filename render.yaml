# Infraestructura en Render (https://render.com/docs/blueprint-spec).
# Los valores con "sync: false" son secretos: se escriben en el panel de Render.
databases:
  - name: burger-station-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"

services:
  # Backend: FastAPI dentro de su contenedor Docker.
  - type: web
    name: burger-station-carlos-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: burger-station-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDGRID_FROM_EMAIL
        sync: false
      - key: CORS_ORIGINS
        sync: false

  # Frontend: los archivos estáticos que genera "npm run build".
  - type: web
    name: burger-station-carlos
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      # Aplicación de una sola página: cualquier ruta devuelve index.html.
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: NODE_VERSION
        value: "24"